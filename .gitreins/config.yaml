# GitReins co-harness config (LORE-014).
# Keys verified against gitreins 0.15.0 real schema (`gitreins init` output +
# engine/guard_manager.py / lang_detect.py in the installed pipx venv).
# No invented flags: `lint` is boolean-only in this version — for Python the
# lint lane autodetects to `ruff check . --quiet` (plus a ruff format check),
# which is the CI lint command the Python package lane uses.
guards:
  secrets: true
  lint: true
  tests: true
  test_mode: full
  # uv-based repo (uv sync --extra dev provisions pytest); bare `pytest` would
  # exit 127 inside the guard subprocess until uv creates .venv (GR-GAP-064).
  test_command: uv run pytest -x --tb=short
  # Board-only commits (no code changed) rely on this: lanes with nothing to
  # grade skip instead of false-DEGRADED-blocking the commit.
  allow_skips: true
evaluator:
  # Escalation history (gitreins-cap-sizing discipline: record the ladder, not
  # just the value, so the next tick does not re-derive it):
  #   2026-09-23 LORE-003: starved at 15 (16.0 used) -> raised to 25 -> PASS.
  #   2026-09-23 LORE-004: starved at 25 (25.0 used exact equality = the
  #     starvation signal), tier1 PASS, tier2 INCOMPLETE, no merits finding.
  #     Token burn that run: ~476K of the 10M effective budget (usage.jsonl) —
  #     iterations are the binding knob, tokens are not. -> raised to 50.
  #   Sizing: 9 Python source files; the table's <100-file rung is 50.
  # No stage pin and no `defaults:` copy exists in this config, so
  # evaluator.max_iterations is the effective cap (proven by importing
  # engine.eval_cap.eval_cap_from_config, not by grepping).
  max_iterations: 50
  # 2026-09-26 LORE-037: wall-clock cap. 9 source files; the audit
  # (check-gitreins-judge.py) requires max_time to be set. 30m matches the
  # schema template's own commented example — no starvation recorded at this
  # rung on a repo this size (iterations are the binding knob, see above).
  max_time: "30m"
# defaults.model — the judge model. deepseek-v4-flash is the canonical cheap
# judge (env GITREINS_LLM_MODEL agrees); api_key_env omitted because
# GITREINS_LLM_API_KEY is provided by the environment.
defaults:
  model: deepseek-v4-flash
history:
  enabled: true
  storage: git
  max_verdicts: 1000
worktree_fleet:
  disk_ceiling_mb: 4096